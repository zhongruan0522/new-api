name: CI

# 所有 push（任意分支与标签）必须先通过本工作流。Docker 发布工作流
# （docker-image.yml）已收口为两个入口：本工作流全绿后的 workflow_dispatch
# 派发（见 trigger-docker job），或维护者手动触发。
on:
  push:
    branches:
      - '**'
    tags:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-checks:
    name: Web checks (typecheck / lint / format / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun test

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 完整 rsbuild 生产构建：低内存环境（本地沙箱等）可能 OOM 跑不完，
      # 前端产物的完整性必须在这里验证。
      - name: Build
        run: VITE_REACT_APP_VERSION=ci bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  go-checks:
    name: Go checks (vet / build / test)
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # web/embed.go 的 //go:embed dist 要求产物真实存在，且
      # internal/app/webdist 有测试校验嵌入的 index.html 非空合法，
      # 因此 Go 检查复用 web-build 的真实产物而非占位文件。
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  trigger-docker:
    name: Trigger docker publish
    needs: [web-checks, web-build, go-checks]
    # 仅发布分支与标签在 CI 全绿后派发 Docker 发布；其余分支只做检查。
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/beta' ||
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/test' ||
        startsWith(github.ref, 'refs/tags/')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # 用 GITHUB_TOKEN 触发 workflow_dispatch 属于官方允许的工作流链接
      # 方式（token 递归触发限制的例外清单明确包含 workflow_dispatch）。
      - name: Dispatch docker publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run docker-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REF"
          echo "Dispatched docker publish for $REF"
